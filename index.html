<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Création de sites internet en Valais — Newrigen</title>
    <meta name="description" content="Sites internet sur mesure pour les commerces et les indépendants du Valais : rapides sur téléphone, trouvables sur Google, modifiables par vous. Prix ferme annoncé avant de commencer, devis gratuit." />
    <meta name="theme-color" content="#0B1220" />
    <!-- Open Graph. Domaine officiel : newrigen.ch — l'application est sur app.newrigen.ch. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Newrigen" />
    <meta property="og:locale" content="fr_CH" />
    <meta property="og:title" content="Création de sites internet en Valais — Newrigen" />
    <meta property="og:description" content="Sites internet sur mesure pour les commerces et les indépendants du Valais : rapides sur téléphone, trouvables sur Google, modifiables par vous. Prix ferme annoncé avant de commencer, devis gratuit." />
    <meta property="og:url" content="https://newrigen.ch/" />
    <meta property="og:image" content="https://newrigen.ch/og-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Newrigen — création de sites internet en Valais" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://newrigen.ch/og-v2.png" />
    <meta name="twitter:title" content="Newrigen — Devis, chantiers et facturation pour artisans suisses" />
    <meta name="twitter:description" content="Créez vos devis, suivez vos chantiers et facturez en QR-facture. Logiciel suisse pour PME et artisans, dès 49 CHF/mois, essai gratuit 30 jours sans carte bancaire." />

    <!-- Versions linguistiques. Le site est une application monopage : la langue
         se choisit avec ?lang=. Sans ces balises, les versions allemande,
         anglaise et portugaise n'existent pas pour les moteurs de recherche.
         Domaine officiel : newrigen.ch (application sur app.newrigen.ch). -->
    <link rel="canonical" href="https://newrigen.ch/" />

    <!-- Polices du site : Bricolage Grotesque pour les titres, Manrope pour le
         texte. `display=swap` : le texte s'affiche immediatement dans la police
         de secours, on ne fait jamais attendre la lecture pour une police. La
         pre-connexion fait gagner l'aller-retour DNS + TLS vers les deux hotes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" />

    <!-- Le plan large du heros, demande des la premiere ligne du document.
         Il est l'element que la mesure du LCP regarde, et il est aussi cache
         derriere le panneau de consentement : sans ce prechargement, son
         telechargement ne commencerait qu'apres le clic, et la page passerait
         du panneau a un fond vide. `imagesrcset` reprend exactement celui de
         la balise picture, sinon le navigateur precharge une largeur et en
         affiche une autre. -->
    <link rel="preload" as="image" type="image/avif"
          href="/media/hero-1280.avif"
          imagesrcset="/media/hero-640.avif 640w, /media/hero-1280.avif 1280w, /media/hero-1920.avif 1920w"
          imagesizes="100vw" fetchpriority="high" />
    <link rel="alternate" hreflang="fr" href="https://newrigen.ch/?lang=fr" />
    <link rel="alternate" hreflang="de" href="https://newrigen.ch/?lang=de" />
    <link rel="alternate" hreflang="en" href="https://newrigen.ch/?lang=en" />
    <link rel="alternate" hreflang="pt" href="https://newrigen.ch/?lang=pt" />
    <link rel="alternate" hreflang="it" href="https://newrigen.ch/?lang=it" />
    <link rel="alternate" hreflang="x-default" href="https://newrigen.ch/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
